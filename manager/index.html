<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Apps</title>
<style>
  :root { color-scheme: dark; --bg: #0b0e17; --panel: #151a29; --line: #263049; --text: #eef1f8; --dim: #9aa5c0; --accent: #4da3ff; --danger: #ff5d5d; }
  * { box-sizing: border-box; }
  html { font-size: 22px; }   /* large type: this is read on a screen floating in VR */
  body { margin: 0; padding: 1.6rem 2.2rem 5rem; background: var(--bg); color: var(--text);
         font-family: "Noto Sans", "DejaVu Sans", system-ui, sans-serif; line-height: 1.35; }
  h1 { font-size: 1.9rem; margin: 0 0 .2rem; }
  h2 { font-size: 1.15rem; margin: 2rem 0 .7rem; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; }
  p.lead { margin: 0; color: var(--dim); }
  button, input { font: inherit; color: inherit; }
  button { cursor: pointer; border: 2px solid var(--line); background: var(--panel); border-radius: .6rem; padding: .55rem 1rem; }
  button:hover { border-color: var(--accent); }
  button:focus-visible, input:focus-visible { outline: 4px solid var(--accent); outline-offset: 3px; }
  button[disabled] { opacity: .45; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: #06121f; font-weight: 700; }
  button.danger.armed { background: var(--danger); border-color: var(--danger); color: #1b0606; font-weight: 700; }

  .apps { display: grid; gap: .6rem; }
  .app { display: flex; align-items: center; gap: 1rem; padding: .7rem 1rem; background: var(--panel); border: 2px solid var(--line); border-radius: .8rem; }
  .app img, .app .noicon { width: 3rem; height: 3rem; border-radius: .6rem; flex: none; object-fit: cover; }
  .app .noicon { background: var(--line); }
  .app .meta { flex: 1; min-width: 0; }
  .app .name { font-weight: 700; }
  .app .url, .empty { color: var(--dim); font-size: .85rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .empty { padding: .4rem 0; white-space: normal; font-size: 1rem; }
  .help { padding: .9rem 1.2rem; background: var(--panel); border: 2px solid var(--accent); border-radius: .8rem; }
  .help ol { margin: .5rem 0 .9rem; padding-left: 1.4rem; line-height: 1.6; }
  .help .row { display: flex; gap: .7rem; }

  .catalogue { display: grid; grid-template-columns: repeat(auto-fill, minmax(11.5rem, 1fr)); gap: .7rem; }
  .tile { height: 5.4rem; border: 2px solid transparent; border-radius: .8rem; padding: .6rem .8rem; text-align: left;
          display: flex; flex-direction: column; justify-content: space-between; font-weight: 700; }
  .tile small { font-weight: 500; font-size: .7rem; opacity: .9; }

  form { display: flex; gap: .7rem; flex-wrap: wrap; align-items: stretch; }
  input { background: var(--panel); border: 2px solid var(--line); border-radius: .6rem; padding: .55rem .8rem; min-width: 0; }
  #url { flex: 2 1 16rem; } #name { flex: 1 1 10rem; }
  .hint { color: var(--dim); font-size: .8rem; margin: .5rem 0 0; }

  #toast { position: fixed; left: 50%; bottom: 1.4rem; transform: translateX(-50%); max-width: 80vw; padding: .7rem 1.2rem; border-radius: .8rem;
           background: #1f2b46; border: 2px solid var(--accent); opacity: 0; transition: opacity .25s; pointer-events: none; }
  #toast.show { opacity: 1; } #toast.error { border-color: var(--danger); }
</style>
</head>
<body>
  <h1>Web Apps</h1>
  <p class="lead">Add websites to your Steam library as apps that work with the controller.</p>

  <h2>Your apps</h2>
  <div id="apps" class="apps"></div>

  <h2>Add a site</h2>
  <div id="catalogue" class="catalogue"></div>

  <h2>Another site</h2>
  <form id="custom">
    <input id="url" placeholder="Address, for example netflix.com" autocomplete="off" autocapitalize="off" spellcheck="false">
    <input id="name" placeholder="Name (optional)" autocomplete="off" maxlength="40">
    <button class="primary" type="submit">Add</button>
  </form>
  <p class="hint">Leave the name empty to use the site's own name.</p>

  <div id="toast" role="status"></div>

<script>
(() => {
  'use strict';
  const token = new URLSearchParams(location.search).get('t') || '';
  const $ = (id) => document.getElementById(id);
  let busy = false;

  async function api(path, body) {
    const r = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: { 'X-Frame-Webapps-Token': token, 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined,
    });
    return r.json();
  }

  let toastTimer;
  function toast(text, error) {
    const t = $('toast');
    t.textContent = text;
    t.className = 'show' + (error ? ' error' : '');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { t.className = ''; }, error ? 8000 : 4500);
  }

  function el(tag, props, ...children) {
    const e = Object.assign(document.createElement(tag), props || {});
    e.append(...children);
    return e;
  }

  // A button that needs a second press to act (no pop-up dialogs: they don't work well with a controller).
  function confirmButton(button, armedText, action) {
    const label = button.textContent;
    let timer;
    button.addEventListener('click', () => {
      if (busy) return;
      if (!button.classList.contains('armed')) {
        button.classList.add('armed');
        button.textContent = armedText;
        timer = setTimeout(() => { button.classList.remove('armed'); button.textContent = label; }, 5000);
        return;
      }
      clearTimeout(timer);
      button.classList.remove('armed');
      button.textContent = label;
      action();
    });
  }

  // Readable text colour on a tile.
  function textOn(hex) {
    const n = parseInt(hex.slice(1), 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
    return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? '#10141d' : '#ffffff';
  }

  async function run(text, path, body) {
    if (busy) return;
    busy = true;
    let ok = false;
    document.body.style.cursor = 'progress';
    toast(text);
    try {
      const r = await api(path, body);
      ok = !!r.ok;
      toast(r.ok ? r.message : r.error || 'That did not work.', !r.ok);
    } catch (e) {
      toast('Could not reach the manager. Close and reopen Web Apps.', true);
    }
    busy = false;
    document.body.style.cursor = '';
    await refresh();
    return ok;
  }

  function render(state) {
    const apps = $('apps');
    apps.replaceChildren();
    if (!state.apps.length) {
      apps.append(el('div', { className: 'empty', textContent: 'No web apps yet. Pick one below.' }));
    }
    for (const app of state.apps) {
      const remove = el('button', { className: 'danger', textContent: 'Remove' });
      confirmButton(remove, 'Press again to remove', () => run(`Removing ${app.name}...`, '/api/remove', { name: app.name }));
      // Extensions: explain first, in plain words, then open the store.
      const extensions = el('button', { textContent: 'Extensions' });
      const open = el('button', { className: 'primary', textContent: 'Open the store' });
      const cancel = el('button', { textContent: 'Not now' });
      const help = el('div', { className: 'help', hidden: true },
        el('div', { textContent: `Extensions add extras to ${app.name}, such as an ad blocker. They come from the Chrome Web Store.` }),
        el('ol', null,
          el('li', { textContent: 'Press "Open the store". A browser window opens.' }),
          el('li', { textContent: 'Find what you want and choose "Add to Chrome". Use the pointer for this (tap grip).' }),
          el('li', { textContent: 'When you are done, close the tab: point at the small X on the tab at the top of the window. That brings you back here.' }),
          el('li', { textContent: `The next time you open ${app.name}, the extension is there.` })),
        el('div', { className: 'row' }, open, cancel));
      extensions.addEventListener('click', () => { help.hidden = !help.hidden; if (!help.hidden) open.focus(); });
      cancel.addEventListener('click', () => { help.hidden = true; extensions.focus(); });
      open.addEventListener('click', () => run(`Opening the Chrome Web Store for ${app.name}...`, '/api/extensions', { name: app.name, width: screen.width, height: screen.height }));
      // TV mode: only for apps whose site has a TV interface. The button shows the state and switches it.
      const tv = app.tv === null ? '' : el('button', { textContent: app.tv ? 'TV mode: on' : 'TV mode: off' });
      if (tv) tv.addEventListener('click', () => run(`Switching ${app.name}...`, '/api/tv', { name: app.name, on: !app.tv }));
      const icon = app.icon ? el('img', { src: app.icon, alt: '' }) : el('div', { className: 'noicon' });
      apps.append(el('div', { className: 'app' }, icon,
        el('div', { className: 'meta' },
          el('div', { className: 'name', textContent: app.name }),
          el('div', { className: 'url', textContent: (app.tv ? 'TV interface' : app.url) + (app.inSteam ? '' : ' (not in Steam)') })),
        tv, extensions, remove), help);
    }

    const catalogue = $('catalogue');
    catalogue.replaceChildren();
    for (const site of state.catalogue) {
      const note = site.added ? 'Added' : (site.controller === 'native' ? 'Game streaming' : site.tv ? 'TV mode' : '');
      const tile = el('button', { className: 'tile', disabled: !!site.added },
        el('span', { textContent: site.name }), el('small', { textContent: note }));
      tile.style.background = site.color;
      tile.style.color = textOn(site.color);
      tile.addEventListener('click', () => run(`Adding ${site.name}...`, '/api/add',
        { name: site.name, url: site.url, color: site.color, controller: site.controller, tv: site.tv }));
      catalogue.append(tile);
    }
    if (!state.steamRunning) toast('Steam is not running. Start Steam to add apps.', true);
  }

  async function refresh() {
    try { render(await api('/api/state')); } catch (e) { toast('Could not reach the manager. Close and reopen Web Apps.', true); }
  }

  $('custom').addEventListener('submit', (e) => {
    e.preventDefault();
    const url = $('url').value.trim(), name = $('name').value.trim();
    if (!url) { toast('Type the address of the site first.', true); return; }
    run(`Adding ${name || url}...`, '/api/add', { name, url }).then((ok) => { if (ok) { $('url').value = ''; $('name').value = ''; } });
  });

  refresh();
})();
</script>
</body>
</html>
